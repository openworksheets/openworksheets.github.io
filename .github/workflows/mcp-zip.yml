# Adjunta el servidor MCP a cada versión publicada.
#
# El diálogo de la aplicación enlaza a
# releases/latest/download/openworksheets-mcp.zip, que devuelve 404 si la última
# release no lleva ese adjunto: hacerlo a mano significa que un despiste rompe
# el enlace en silencio. De ahí que lo haga sola.
name: Servidor MCP en la release

on:
  release:
    types: [published]
  # Permite regenerarlo a mano sobre una release ya publicada.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la release (por ejemplo, v1.25.0)'
        required: true

permissions:
  contents: write

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la carpeta
        run: |
          mkdir -p dist/openworksheets-mcp
          cp -r mcp/. dist/openworksheets-mcp/
          # Lo que no forma parte de lo que se descarga
          rm -rf dist/openworksheets-mcp/node_modules \
                 dist/openworksheets-mcp/.gitignore \
                 dist/openworksheets-mcp/package-lock.json
          # La aplicación, para que la vista previa del MCP sea el visor real del
          # alumnado (render.html monta app/js/player.js). Se copia aquí en vez de
          # tenerla duplicada en el repositorio: así no puede desincronizarse.
          mkdir -p dist/openworksheets-mcp/app
          cp -r js css fonts dist/openworksheets-mcp/app/
          # MathJax lo pide mathrender.js como vendor/… relativo al documento.
          cp vendor/mathjax-tex-svg.js dist/openworksheets-mcp/vendor/

      - name: Comprobar que está completo y sin errores de sintaxis
        run: |
          cd dist/openworksheets-mcp
          for f in server.js session.js fieldspec.js browser.js cdp.js chrome.js zip.js; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
            node --check "$f"
          done
          test -f workbench.html || { echo "Falta workbench.html"; exit 1; }
          test -f render.html || { echo "Falta render.html"; exit 1; }
          # Sin la copia de la aplicación la vista previa deja de ser el visor
          # real y vuelve al dibujo aproximado: eso no debe salir en una release.
          test -f app/js/player.js || { echo "Falta app/js/player.js"; exit 1; }
          test -f app/css/app.css || { echo "Falta app/css/app.css"; exit 1; }
          test -f vendor/mathjax-tex-svg.js || { echo "Falta vendor/mathjax-tex-svg.js"; exit 1; }
          test -f vendor/pdf.min.js || { echo "Falta vendor/pdf.min.js"; exit 1; }
          test -f vendor/pdf.worker.min.js || { echo "Falta vendor/pdf.worker.min.js"; exit 1; }
          # La copia de pdf.js debe ser la misma que usa la aplicación
          cmp vendor/pdf.min.js ../../vendor/pdf.min.js
          cmp vendor/pdf.worker.min.js ../../vendor/pdf.worker.min.js

      - name: Empaquetar
        run: cd dist && zip -q -r ../openworksheets-mcp.zip openworksheets-mcp

      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" openworksheets-mcp.zip --clobber
